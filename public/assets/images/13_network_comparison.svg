<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <marker id="a8" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <pattern id="hatch3" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#bbb" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1100" height="440" fill="#fff"/>

  <text x="550" y="36" text-anchor="middle" fill="#111" font-size="22" font-weight="bold" letter-spacing="1">Infrastructure Architecture Transformation</text>
  <line x1="300" y1="46" x2="800" y2="46" stroke="#111" stroke-width="1.5"/>
  <text x="550" y="66" text-anchor="middle" fill="#666" font-size="12" font-style="italic" font-family="'Helvetica Neue', sans-serif">From InfiniBand-Dependent to Ethernet-Capable Distributed Training</text>

  <!-- Left: Current (InfiniBand required) -->
  <g transform="translate(30, 85)" font-family="'Helvetica Neue', sans-serif">
    <rect width="500" height="320" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect width="500" height="26" rx="2" fill="#eee" stroke="#333" stroke-width="1.5"/>
    <text x="250" y="19" text-anchor="middle" fill="#333" font-size="13" font-weight="bold">Current: InfiniBand Required</text>

    <!-- Node 1 -->
    <rect x="40" y="50" width="180" height="55" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
    <text x="130" y="72" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">GPU Node 1</text>
    <text x="130" y="90" text-anchor="middle" fill="#888" font-size="10">8× H100 (NVLink)</text>

    <!-- InfiniBand link -->
    <rect x="240" y="62" width="120" height="30" rx="2" fill="url(#hatch3)" stroke="#333" stroke-width="1.5"/>
    <text x="300" y="82" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">InfiniBand</text>
    <text x="300" y="72" text-anchor="middle" fill="#888" font-size="8">400 Gbps · ~$15M</text>

    <!-- Node 2 -->
    <rect x="40" y="120" width="180" height="55" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
    <text x="130" y="142" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">GPU Node 2</text>
    <text x="130" y="160" text-anchor="middle" fill="#888" font-size="10">8× H100 (NVLink)</text>

    <line x1="130" y1="105" x2="130" y2="120" stroke="#333" stroke-width="1.5"/>
    <line x1="220" y1="77" x2="240" y2="77" stroke="#333" stroke-width="1"/>
    <line x1="360" y1="77" x2="380" y2="77" stroke="#333" stroke-width="1"/>

    <!-- Constraints -->
    <g transform="translate(40, 195)">
      <text x="0" y="0" fill="#333" font-size="11" font-weight="bold">Constraints:</text>
      <text x="0" y="20" fill="#555" font-size="11">× InfiniBand mandatory — $8M premium</text>
      <text x="0" y="38" fill="#555" font-size="11">× FP32 AllReduce saturates network</text>
      <text x="0" y="56" fill="#555" font-size="11">× Ethernet = 9–10× slower → unusable</text>
      <text x="0" y="74" fill="#555" font-size="11">× Multi-datacenter training impossible</text>
      <text x="0" y="92" fill="#555" font-size="11">× Vendor lock-in (NVIDIA Quantum switches)</text>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(535, 230)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#333" stroke-width="2" marker-end="url(#a8)"/>
    <text x="15" y="-8" text-anchor="middle" fill="#111" font-size="9" font-weight="bold" font-family="'Helvetica Neue', sans-serif">TQ 8×</text>
  </g>

  <!-- Right: With TurboQuant -->
  <g transform="translate(570, 85)" font-family="'Helvetica Neue', sans-serif">
    <rect width="500" height="320" rx="2" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect width="500" height="26" rx="2" fill="#ddd" stroke="#111" stroke-width="2"/>
    <text x="250" y="19" text-anchor="middle" fill="#111" font-size="13" font-weight="bold">With TurboQuant: Ethernet Sufficient</text>

    <!-- Node 1 -->
    <rect x="40" y="50" width="180" height="55" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
    <text x="130" y="72" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">GPU Node 1</text>
    <text x="130" y="90" text-anchor="middle" fill="#888" font-size="10">8× H100 (NVLink)</text>

    <!-- Ethernet link -->
    <rect x="240" y="62" width="120" height="30" rx="2" fill="#f0f0f0" stroke="#111" stroke-width="1.5"/>
    <text x="300" y="72" text-anchor="middle" fill="#111" font-size="10" font-weight="bold">Ethernet 100G</text>
    <text x="300" y="84" text-anchor="middle" fill="#555" font-size="8">INT4 → eff. 800 Gbps · ~$7M</text>

    <!-- Node 2 -->
    <rect x="40" y="120" width="180" height="55" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
    <text x="130" y="142" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">GPU Node 2</text>
    <text x="130" y="160" text-anchor="middle" fill="#888" font-size="10">8× H100 (NVLink)</text>

    <line x1="130" y1="105" x2="130" y2="120" stroke="#333" stroke-width="1.5"/>
    <line x1="220" y1="77" x2="240" y2="77" stroke="#333" stroke-width="1"/>
    <line x1="360" y1="77" x2="380" y2="77" stroke="#333" stroke-width="1"/>

    <!-- Benefits -->
    <g transform="translate(40, 195)">
      <text x="0" y="0" fill="#111" font-size="11" font-weight="bold">Enabled Scenarios:</text>
      <text x="0" y="20" fill="#333" font-size="11" font-weight="bold">✓ $8M infrastructure savings (1,000-GPU)</text>
      <text x="0" y="38" fill="#333" font-size="11" font-weight="bold">✓ Ethernet eff. 800 Gbps &gt; IB NDR 400 Gbps</text>
      <text x="0" y="56" fill="#333" font-size="11" font-weight="bold">✓ Multi-datacenter training feasible</text>
      <text x="0" y="74" fill="#333" font-size="11" font-weight="bold">✓ Cloud-hybrid training practical</text>
      <text x="0" y="92" fill="#333" font-size="11" font-weight="bold">✓ Commodity hardware sufficient</text>
    </g>
  </g>
</svg>