    <text x="315" y="204" text-anchor="middle" fill="#111" font-weight="bold">GPT-2 Small / 124M</text>
    <text x="445" y="204" text-anchor="middle" fill="#111" font-weight="bold">7.123</text>
    <text x="575" y="204" text-anchor="middle" fill="#111" font-weight="bold">7.142</text>
    <text x="695" y="204" text-anchor="middle" fill="#111" font-weight="bold">+0.019</text>
    <text x="805" y="204" text-anchor="middle" fill="#111" font-weight="bold">500</text>
    <text x="905" y="204" text-anchor="middle" fill="#111" font-weight="bold">PASS ★</text>
    <text x="995" y="204" text-anchor="middle" fill="#111" font-weight="bold">GPU</text>

