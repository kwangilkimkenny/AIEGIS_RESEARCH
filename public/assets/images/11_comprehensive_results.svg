    <text x="445" y="232" text-anchor="middle" fill="#111" font-weight="bold">6.456</text>
    <text x="575" y="232" text-anchor="middle" fill="#111" font-weight="bold">6.457</text>
    <text x="695" y="232" text-anchor="middle" fill="#111" font-weight="bold">+0.002</text>
    <text x="805" y="232" text-anchor="middle" fill="#111" font-weight="bold">1,500</text>
    <text x="905" y="232" text-anchor="middle" fill="#111" font-weight="bold">PASS ★</text>
    <text x="995" y="232" text-anchor="middle" fill="#111" font-weight="bold">GPU</text>

    <!-- Row 7 (highlighted) -->
    <rect y="242" width="1040" height="28" fill="#f5f5f5" stroke="#111" stroke-width="1.2"/>
    <text x="125" y="260" text-anchor="middle" fill="#111" font-weight="bold">GPT-2 Medium + AMP</text>
    <text x="315" y="260" text-anchor="middle" fill="#111" font-weight="bold">GPT-2 Med / 355M</text>
    <text x="445" y="260" text-anchor="middle" fill="#111" font-weight="bold">7.357</text>
    <text x="575" y="260" text-anchor="middle" fill="#111" font-weight="bold">7.360</text>
    <text x="695" y="260" text-anchor="middle" fill="#111" font-weight="bold">+0.002</text>
    <text x="805" y="260" text-anchor="middle" fill="#111" font-weight="bold">500</text>
    <text x="905" y="260" text-anchor="middle" fill="#111" font-weight="bold">PASS ★</text>
    <text x="995" y="260" text-anchor="middle" fill="#111" font-weight="bold">GPU</text>

    <!-- Row 8 (highlighted) -->
    <rect y="270" width="1040" height="28" fill="#f0f0f0" stroke="#111" stroke-width="1.2"/>
    <text x="125" y="288" text-anchor="middle" fill="#111" font-weight="bold">Combined (Act+Mom)</text>
    <text x="315" y="288" text-anchor="middle" fill="#111" font-weight="bold">Transformer / 70M</text>
    <text x="445" y="288" text-anchor="middle" fill="#111" font-weight="bold">5.816</text>
    <text x="575" y="288" text-anchor="middle" fill="#111" font-weight="bold">5.817</text>
    <text x="695" y="288" text-anchor="middle" fill="#111" font-weight="bold">+0.000</text>
    <text x="805" y="288" text-anchor="middle" fill="#111" font-weight="bold">800</text>
    <text x="905" y="288" text-anchor="middle" fill="#111" font-weight="bold">PASS ★</text>
    <text x="995" y="288" text-anchor="middle" fill="#111" font-weight="bold">GPU</text>

    <!-- Section: Performance -->
