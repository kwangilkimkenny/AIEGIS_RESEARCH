<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="'Georgia', 'Times New Roman', serif">
  <rect width="1100" height="520" fill="#fff"/>

  <text x="550" y="36" text-anchor="middle" fill="#111" font-size="22" font-weight="bold" letter-spacing="1">Comprehensive Experiment Results</text>
  <line x1="320" y1="46" x2="780" y2="46" stroke="#111" stroke-width="1.5"/>
  <text x="550" y="66" text-anchor="middle" fill="#666" font-size="12" font-style="italic" font-family="'Helvetica Neue', sans-serif">From 1M to 355M Parameters — Full Validation Spectrum</text>

