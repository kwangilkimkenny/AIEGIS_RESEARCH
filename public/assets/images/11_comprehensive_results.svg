    <line x1="380" y1="0" x2="380" y2="30" stroke="#333" stroke-width="1"/>
    <line x1="510" y1="0" x2="510" y2="30" stroke="#333" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="30" stroke="#333" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="30" stroke="#333" stroke-width="1"/>
    <line x1="860" y1="0" x2="860" y2="30" stroke="#333" stroke-width="1"/>
    <line x1="950" y1="0" x2="950" y2="30" stroke="#333" stroke-width="1"/>
    <text x="125" y="20" text-anchor="middle" fill="#111" font-size="11" font-weight="bold">Experiment</text>
    <text x="315" y="20" text-anchor="middle" fill="#111" font-size="11" font-weight="bold">Model / Scale</text>
    <text x="445" y="20" text-anchor="middle" fill="#111" font-size="11" font-weight="bold">Baseline Loss</text>
    <text x="575" y="20" text-anchor="middle" fill="#111" font-size="11" font-weight="bold">TQ Loss</text>
    <text x="695" y="20" text-anchor="middle" fill="#111" font-size="11" font-weight="bold">Gap</text>
    <text x="805" y="20" text-anchor="middle" fill="#111" font-size="11" font-weight="bold">Steps</text>
    <text x="905" y="20" text-anchor="middle" fill="#111" font-size="11" font-weight="bold">Status</text>
    <text x="995" y="20" text-anchor="middle" fill="#111" font-size="11" font-weight="bold">Phase</text>

    <!-- Section: M4 Concept Validation -->
    <rect y="30" width="1040" height="22" fill="#f0f0f0" stroke="#333" stroke-width="0.5"/>
    <text x="520" y="46" text-anchor="middle" fill="#555" font-size="10" font-weight="bold">CONCEPT VALIDATION (Apple M4, MPS)</text>

    <!-- Row 1 -->
    <rect y="52" width="1040" height="28" fill="#fff" stroke="#333" stroke-width="0.5"/>
    <text x="125" y="70" text-anchor="middle" fill="#333">4-bit Gradient (no EF)</text>
    <text x="315" y="70" text-anchor="middle" fill="#888">GPT-2 Nano / ~1M</text>
    <text x="445" y="70" text-anchor="middle" fill="#333">0.402</text>
    <text x="575" y="70" text-anchor="middle" fill="#333">0.756</text>
    <text x="695" y="70" text-anchor="middle" fill="#333">+0.354</text>
    <text x="805" y="70" text-anchor="middle" fill="#888">150</text>
    <text x="905" y="70" text-anchor="middle" fill="#888">Degraded</text>
    <text x="995" y="70" text-anchor="middle" fill="#888">M4</text>

    <!-- Row 2 -->
    <rect y="80" width="1040" height="28" fill="#fafafa" stroke="#333" stroke-width="0.5"/>
    <text x="125" y="98" text-anchor="middle" fill="#333">4-bit Gradient + EF</text>
    <text x="315" y="98" text-anchor="middle" fill="#888">GPT-2 Nano / ~1M</text>
    <text x="445" y="98" text-anchor="middle" fill="#333">0.395</text>
    <text x="575" y="98" text-anchor="middle" fill="#333">1.010</text>
    <text x="695" y="98" text-anchor="middle" fill="#333">+0.615</text>
    <text x="805" y="98" text-anchor="middle" fill="#888">150</text>
    <text x="905" y="98" text-anchor="middle" fill="#333" font-weight="bold">FAIL</text>
    <text x="995" y="98" text-anchor="middle" fill="#888">M4</text>

