    <text x="125" y="126" text-anchor="middle" fill="#333">4-bit Momentum (v_t frozen)</text>
    <text x="315" y="126" text-anchor="middle" fill="#888">GPT-2 Nano / ~1M</text>
    <text x="445" y="126" text-anchor="middle" fill="#333">0.556</text>
    <text x="575" y="126" text-anchor="middle" fill="#333">0.377</text>
    <text x="695" y="126" text-anchor="middle" fill="#111" font-weight="bold">−0.179</text>
    <text x="805" y="126" text-anchor="middle" fill="#888">150</text>
    <text x="905" y="126" text-anchor="middle" fill="#111">PASS</text>
    <text x="995" y="126" text-anchor="middle" fill="#888">M4</text>

    <!-- Row 4 -->
    <rect y="136" width="1040" height="28" fill="#fafafa" stroke="#333" stroke-width="0.5"/>
    <text x="125" y="154" text-anchor="middle" fill="#333">4-bit Activation</text>
    <text x="315" y="154" text-anchor="middle" fill="#888">Nano-Transformer / ~1M</text>
    <text x="445" y="154" text-anchor="middle" fill="#333">1.003</text>
    <text x="575" y="154" text-anchor="middle" fill="#333">1.005</text>
    <text x="695" y="154" text-anchor="middle" fill="#111" font-weight="bold">+0.002</text>
    <text x="805" y="154" text-anchor="middle" fill="#888">150</text>
    <text x="905" y="154" text-anchor="middle" fill="#111">PASS</text>
    <text x="995" y="154" text-anchor="middle" fill="#888">M4</text>

