    <rect width="1040" height="32" rx="2" fill="#f5f5f5" stroke="#111" stroke-width="1.5"/>
    <text x="520" y="22" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Maximum validated: 355M params | 1,500 steps | Loss gap ≤ 0.003 | 8× comm. reduction | 2.8× kernel speedup | AMP compatible</text>
  </g>
</svg>