    <text x="520" y="314" text-anchor="middle" fill="#111" font-size="10" font-weight="bold">PERFORMANCE BENCHMARKS</text>

    <rect y="320" width="1040" height="28" fill="#fff" stroke="#333" stroke-width="0.5"/>
    <text x="125" y="338" text-anchor="middle" fill="#333">Triton Kernel</text>
    <text x="315" y="338" text-anchor="middle" fill="#888">16M elements</text>
    <text x="445" y="338" text-anchor="middle" fill="#333">73.47 ms</text>
    <text x="575" y="338" text-anchor="middle" fill="#111" font-weight="bold">26.21 ms</text>
    <text x="695" y="338" text-anchor="middle" fill="#111" font-weight="bold">2.8×</text>
    <text x="805" y="338" text-anchor="middle" fill="#888">—</text>
    <text x="905" y="338" text-anchor="middle" fill="#111">PASS</text>
    <text x="995" y="338" text-anchor="middle" fill="#888">GPU</text>

    <rect y="348" width="1040" height="28" fill="#fafafa" stroke="#333" stroke-width="0.5"/>
    <text x="125" y="366" text-anchor="middle" fill="#333">Comm. Payload</text>
    <text x="315" y="366" text-anchor="middle" fill="#888">Per AllGather</text>
    <text x="445" y="366" text-anchor="middle" fill="#333">64 MB</text>
    <text x="575" y="366" text-anchor="middle" fill="#111" font-weight="bold">8 MB</text>
    <text x="695" y="366" text-anchor="middle" fill="#111" font-weight="bold">8.0×</text>
    <text x="805" y="366" text-anchor="middle" fill="#888">—</text>
    <text x="905" y="366" text-anchor="middle" fill="#111">PASS</text>
    <text x="995" y="366" text-anchor="middle" fill="#888">GPU</text>
