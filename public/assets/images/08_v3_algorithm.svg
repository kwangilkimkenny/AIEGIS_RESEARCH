<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <marker id="a6" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <pattern id="diag2" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ccc" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1100" height="700" fill="#fff"/>

  <text x="550" y="36" text-anchor="middle" fill="#111" font-size="22" font-weight="bold" letter-spacing="1">TurboQuantAdamW v3 Algorithm</text>
  <line x1="320" y1="46" x2="780" y2="46" stroke="#111" stroke-width="1.5"/>
  <text x="550" y="66" text-anchor="middle" fill="#666" font-size="12" font-style="italic" font-family="'Helvetica Neue', sans-serif">Live v_t + Momentum-Level Error Compensation — Validated to 355M Parameters</text>

  <!-- Timeline -->
  <g transform="translate(60, 85)" font-family="'Helvetica Neue', sans-serif">
    <rect x="0" y="0" width="980" height="10" rx="2" fill="#eee" stroke="#333" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="10" rx="2" fill="#ccc" stroke="#333" stroke-width="1"/>
    <rect x="200" y="0" width="780" height="10" rx="2" fill="#999" stroke="#333" stroke-width="1"/>
    <text x="0" y="-5" fill="#999" font-size="10">Step 0</text>
    <text x="200" y="-5" fill="#333" font-size="11" font-weight="bold">Step W (warmup end)</text>
    <line x1="200" y1="-2" x2="200" y2="12" stroke="#333" stroke-width="1.5"/>
    <text x="980" y="-5" text-anchor="end" fill="#999" font-size="10">Step N</text>
    <text x="100" y="28" text-anchor="middle" fill="#555" font-size="13" font-weight="bold">WARMUP</text>
    <text x="590" y="28" text-anchor="middle" fill="#222" font-size="13" font-weight="bold">COMPRESSION (4-bit Momentum)</text>
  </g>

  <!-- Warmup box -->
  <g transform="translate(40, 125)">
    <rect width="300" height="310" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <rect width="300" height="26" rx="2" fill="#eee" stroke="#333" stroke-width="1.5"/>
    <text x="150" y="19" text-anchor="middle" fill="#222" font-size="12" font-weight="bold" font-family="'Helvetica Neue', sans-serif">Warmup: Standard FP32 AdamW</text>

    <g font-family="'Helvetica Neue', sans-serif" font-size="11">
      <rect x="20" y="42" width="260" height="36" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
      <text x="150" y="57" text-anchor="middle" fill="#333" font-weight="bold">g_t ← backpropagation</text>
      <text x="150" y="72" text-anchor="middle" fill="#888">gradient received</text>

      <line x1="150" y1="78" x2="150" y2="92" stroke="#333" stroke-width="1" marker-end="url(#a6)"/>

      <rect x="20" y="98" width="260" height="32" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
      <text x="150" y="118" text-anchor="middle" fill="#333" font-style="italic">m_t = β₁·m_(t-1) + (1−β₁)·g_t</text>

      <line x1="150" y1="130" x2="150" y2="144" stroke="#333" stroke-width="1" marker-end="url(#a6)"/>

      <rect x="20" y="150" width="260" height="32" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
      <text x="150" y="170" text-anchor="middle" fill="#333" font-style="italic">v_t = β₂·v_(t-1) + (1−β₂)·g_t²</text>

      <line x1="150" y1="182" x2="150" y2="196" stroke="#333" stroke-width="1" marker-end="url(#a6)"/>

      <rect x="20" y="202" width="260" height="32" rx="2" fill="#eee" stroke="#333" stroke-width="1.2"/>
      <text x="150" y="222" text-anchor="middle" fill="#222" font-weight="bold" font-style="italic">θ ← θ − η·m_t/(√v_t + ε)</text>

      <text x="150" y="260" text-anchor="middle" fill="#888" font-size="10" font-style="italic">Build stable v_t statistics</text>
      <text x="150" y="275" text-anchor="middle" fill="#888" font-size="10" font-style="italic">All communication in FP32</text>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(350, 275)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#333" stroke-width="2" marker-end="url(#a6)"/>
    <text x="25" y="-8" text-anchor="middle" fill="#333" font-size="10" font-weight="bold" font-family="'Helvetica Neue', sans-serif">switch</text>
  </g>

  <!-- Compression box (main, larger) -->
  <g transform="translate(410, 125)">
    <rect width="650" height="310" rx="2" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect width="650" height="26" rx="2" fill="#ddd" stroke="#111" stroke-width="2"/>
    <text x="325" y="19" text-anchor="middle" fill="#111" font-size="12" font-weight="bold" font-family="'Helvetica Neue', sans-serif">Compression: 4-bit Momentum + Live v_t + Error Compensation</text>

    <g font-family="'Helvetica Neue', sans-serif" font-size="11">
      <!-- Step 1: m_t update -->
      <rect x="20" y="42" width="290" height="32" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
      <circle cx="38" cy="58" r="10" fill="#eee" stroke="#333" stroke-width="1"/>
      <text x="38" y="62" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">1</text>
      <text x="185" y="62" text-anchor="middle" fill="#333" font-style="italic">m_t = β₁·m_(t-1) + (1−β₁)·g_t</text>

      <!-- Step 2: v_t LIVE update -->
      <rect x="340" y="42" width="290" height="32" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
      <circle cx="358" cy="58" r="10" fill="#eee" stroke="#333" stroke-width="1"/>
      <text x="358" y="62" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">2</text>
      <text x="505" y="62" text-anchor="middle" fill="#222" font-weight="bold">v_t = β₂·v_(t-1) + (1−β₂)·g_t²</text>
      <text x="505" y="52" text-anchor="middle" fill="#111" font-size="9" font-weight="bold">LIVE (not frozen)</text>

      <line x1="165" y1="74" x2="165" y2="92" stroke="#333" stroke-width="1" marker-end="url(#a6)"/>

      <!-- Step 3: Error Compensation -->
      <rect x="20" y="98" width="290" height="32" rx="2" fill="#f0f0f0" stroke="#333" stroke-width="1.2"/>
      <circle cx="38" cy="114" r="10" fill="#eee" stroke="#333" stroke-width="1"/>
      <text x="38" y="118" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">3</text>
      <text x="185" y="118" text-anchor="middle" fill="#222" font-weight="bold" font-style="italic">p_t = m_t + e_(t-1)</text>
      <text x="185" y="108" text-anchor="middle" fill="#555" font-size="9">Error Compensation</text>

      <line x1="165" y1="130" x2="165" y2="148" stroke="#333" stroke-width="1" marker-end="url(#a6)"/>

      <!-- Step 4: Hadamard + Lloyd-Max -->
      <rect x="20" y="154" width="290" height="40" rx="2" fill="#eee" stroke="#111" stroke-width="1.5"/>
      <circle cx="38" cy="174" r="10" fill="#ddd" stroke="#111" stroke-width="1"/>
      <text x="38" y="178" text-anchor="middle" fill="#111" font-size="10" font-weight="bold">4</text>
      <text x="185" y="170" text-anchor="middle" fill="#111" font-weight="bold">4-bit Quantization</text>
      <text x="185" y="186" text-anchor="middle" fill="#444" font-style="italic">q_t = H⁻¹[Q_LM(H[p_t])]</text>

      <line x1="165" y1="194" x2="165" y2="210" stroke="#333" stroke-width="1" marker-end="url(#a6)"/>

      <!-- Step 5: Error buffer -->
      <rect x="340" y="154" width="290" height="40" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
      <circle cx="358" cy="174" r="10" fill="#eee" stroke="#333" stroke-width="1"/>
      <text x="358" y="178" text-anchor="middle" fill="#333" font-size="10" font-weight="bold">5</text>
      <text x="505" y="170" text-anchor="middle" fill="#333" font-weight="bold">Error Buffer Update</text>
      <text x="505" y="186" text-anchor="middle" fill="#666" font-style="italic">e_t = p_t − q_t</text>

      <!-- Arrow from 4→5 -->
      <line x1="310" y1="174" x2="335" y2="174" stroke="#333" stroke-width="1" marker-end="url(#a6)"/>

      <!-- Step 6: AllGather (INT4) -->
      <rect x="20" y="216" width="610" height="36" rx="2" fill="#e8e8e8" stroke="#111" stroke-width="1.5"/>
      <circle cx="38" cy="234" r="10" fill="#ddd" stroke="#111" stroke-width="1"/>
      <text x="38" y="238" text-anchor="middle" fill="#111" font-size="10" font-weight="bold">6</text>
      <text x="325" y="238" text-anchor="middle" fill="#111" font-weight="bold">INT4 AllGather — 8× bandwidth reduction (only q_t transmitted)</text>

      <line x1="325" y1="252" x2="325" y2="268" stroke="#333" stroke-width="1" marker-end="url(#a6)"/>

      <!-- Step 7: Weight update with live v_t -->
      <rect x="80" y="274" width="490" height="28" rx="2" fill="#f0f0f0" stroke="#111" stroke-width="1.5"/>
      <text x="325" y="292" text-anchor="middle" fill="#111" font-weight="bold" font-style="italic">θ ← θ − η · q_t / (√(v_t / bias_corr₂) + ε)</text>

      <!-- Arrow from live v_t to step 7 -->
      <path d="M485,74 Q620,74 620,180 Q620,284 570,284" stroke="#333" stroke-width="1" fill="none" stroke-dasharray="4,3" marker-end="url(#a6)"/>
      <text x="635" y="180" fill="#555" font-size="9" font-family="'Helvetica Neue', sans-serif">live v_t</text>
    </g>
  </g>

  <!-- Key insight boxes -->
  <g transform="translate(40, 460)" font-family="'Helvetica Neue', sans-serif">
    <rect width="1020" height="110" rx="2" fill="#fafafa" stroke="#333" stroke-width="1"/>
    <rect width="1020" height="24" fill="#eee" stroke="#333" stroke-width="1"/>
    <text x="510" y="17" text-anchor="middle" fill="#222" font-size="12" font-weight="bold">v3 Design Rationale — Three Critical Decisions</text>

    <text x="30" y="46" fill="#111" font-size="12" font-weight="bold">1. Compress m_t (not g_t)</text>
    <text x="260" y="46" fill="#555" font-size="11">Momentum is EMA-smoothed → higher quantization quality than raw gradients</text>

    <text x="30" y="70" fill="#111" font-size="12" font-weight="bold">2. Keep v_t live (not frozen)</text>
    <text x="260" y="70" fill="#555" font-size="11">Frozen v_t diverges at 124M+ scale; live v_t tracks distribution shift (Section 4.3)</text>

    <text x="30" y="94" fill="#111" font-size="12" font-weight="bold">3. EC at momentum level</text>
    <text x="260" y="94" fill="#555" font-size="11">Error e_(t-1) enters m_t path only — never reaches v_t squared term → no nonlinear amplification</text>
  </g>

  <!-- Validation badge -->
  <g transform="translate(40, 590)" font-family="'Helvetica Neue', sans-serif">
    <rect width="1020" height="90" rx="2" fill="#fff" stroke="#111" stroke-width="2"/>
    <rect width="1020" height="24" fill="#ddd" stroke="#111" stroke-width="2"/>
    <text x="510" y="17" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Validation Summary</text>

    <text x="30" y="46" fill="#333" font-size="11"><tspan font-weight="bold">GPT-2 Small (124M)</tspan>  Loss gap +0.019 @ 500 steps</text>
    <text x="350" y="46" fill="#333" font-size="11"><tspan font-weight="bold">Long-run (1,500 steps)</tspan>  Gap stable at +0.002 — no drift</text>
    <text x="700" y="46" fill="#333" font-size="11"><tspan font-weight="bold">GPT-2 Medium (355M)</tspan>  Gap +0.002 with AMP</text>
    <text x="30" y="70" fill="#333" font-size="11"><tspan font-weight="bold">Combined (Act+Mom)</tspan>  Gap +0.0001 @ 800 steps</text>
    <text x="350" y="70" fill="#333" font-size="11"><tspan font-weight="bold">Triton kernel</tspan>  2.8× speedup, bit-exact accuracy</text>
    <text x="700" y="70" fill="#333" font-size="11"><tspan font-weight="bold">DDP (2× RTX 5000)</tspan>  End-to-end validation</text>
  </g>
</svg>