<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="'Georgia', 'Times New Roman', serif">
  <rect width="1100" height="500" fill="#fff"/>

  <text x="550" y="36" text-anchor="middle" fill="#111" font-size="22" font-weight="bold" letter-spacing="1">Long-Run Convergence Stability</text>
  <line x1="340" y1="46" x2="760" y2="46" stroke="#111" stroke-width="1.5"/>
  <text x="550" y="66" text-anchor="middle" fill="#666" font-size="12" font-style="italic" font-family="'Helvetica Neue', sans-serif">GPT-2 Small (124M) — 1,500 Training Steps — Loss Gap Remains Bounded</text>

  <!-- Chart -->
  <g transform="translate(100, 90)" font-family="'Helvetica Neue', sans-serif">
    <!-- Y axis -->
    <line x1="60" y1="10" x2="60" y2="310" stroke="#333" stroke-width="1.2"/>
    <!-- X axis -->
    <line x1="60" y1="310" x2="900" y2="310" stroke="#333" stroke-width="1.2"/>

    <text x="15" y="165" text-anchor="middle" fill="#333" font-size="12" font-weight="bold" transform="rotate(-90, 15, 165)">Loss</text>
    <text x="480" y="340" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">Training Step</text>

    <!-- Y grid -->
    <text x="52" y="310" text-anchor="end" fill="#888" font-size="10">6.4</text>
    <line x1="60" y1="307" x2="900" y2="307" stroke="#eee" stroke-width="0.5"/>
    <text x="52" y="250" text-anchor="end" fill="#888" font-size="10">6.6</text>
    <line x1="60" y1="247" x2="900" y2="247" stroke="#eee" stroke-width="0.5"/>
    <text x="52" y="190" text-anchor="end" fill="#888" font-size="10">6.8</text>
    <line x1="60" y1="187" x2="900" y2="187" stroke="#eee" stroke-width="0.5"/>
    <text x="52" y="130" text-anchor="end" fill="#888" font-size="10">7.0</text>
    <line x1="60" y1="127" x2="900" y2="127" stroke="#eee" stroke-width="0.5"/>
    <text x="52" y="70" text-anchor="end" fill="#888" font-size="10">7.2</text>
    <line x1="60" y1="67" x2="900" y2="67" stroke="#eee" stroke-width="0.5"/>

    <!-- X labels -->
    <text x="200" y="326" text-anchor="middle" fill="#888" font-size="10">250</text>
    <line x1="200" y1="310" x2="200" y2="315" stroke="#333" stroke-width="1"/>
    <text x="340" y="326" text-anchor="middle" fill="#888" font-size="10">500</text>
    <line x1="340" y1="310" x2="340" y2="315" stroke="#333" stroke-width="1"/>
    <text x="480" y="326" text-anchor="middle" fill="#888" font-size="10">750</text>
    <line x1="480" y1="310" x2="480" y2="315" stroke="#333" stroke-width="1"/>
    <text x="620" y="326" text-anchor="middle" fill="#888" font-size="10">1000</text>
    <line x1="620" y1="310" x2="620" y2="315" stroke="#333" stroke-width="1"/>
    <text x="900" y="326" text-anchor="middle" fill="#888" font-size="10">1500</text>
    <line x1="900" y1="310" x2="900" y2="315" stroke="#333" stroke-width="1"/>

    <!-- FP32 Baseline line (solid) -->
    <!-- 7.2095, 7.0782, 6.8804, 6.7993, 6.4555 -->
    <!-- Scale: 6.4=307, 7.2=67 → range 0.8 maps to 240px → 1 unit = 300px -->
    <!-- y = 307 - (val - 6.4) * 300 -->
    <!-- 7.2095: 307-(0.8095*300)=307-242.9=64.1 -->
    <!-- 7.0782: 307-(0.6782*300)=307-203.5=103.5 -->
    <!-- 6.8804: 307-(0.4804*300)=307-144.1=162.9 -->
    <!-- 6.7993: 307-(0.3993*300)=307-119.8=187.2 -->
    <!-- 6.4555: 307-(0.0555*300)=307-16.7=290.3 -->
    <polyline points="200,64 340,104 480,163 620,187 900,290" stroke="#333" stroke-width="2" fill="none"/>
    <circle cx="200" cy="64" r="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <circle cx="340" cy="104" r="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <circle cx="480" cy="163" r="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <circle cx="620" cy="187" r="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <circle cx="900" cy="290" r="4" fill="#fff" stroke="#333" stroke-width="1.5"/>

    <!-- TQ 4-bit line (dashed) -->
    <!-- 7.2104, 7.0793, 6.8813, 6.8017, 6.4572 -->
    <!-- 7.2104: 64.0-0.27=63.7 → ~64 (very close) -->
    <!-- 7.0793: 103.2 -->
    <!-- 6.8813: 162.6 -->
    <!-- 6.8017: 186.5 -->
    <!-- 6.4572: 289.8 -->
    <polyline points="200,64 340,103 480,163 620,187 900,290" stroke="#333" stroke-width="2" fill="none" stroke-dasharray="8,4"/>
    <circle cx="200" cy="64" r="4" fill="#ccc" stroke="#333" stroke-width="1.5"/>
    <circle cx="340" cy="103" r="4" fill="#ccc" stroke="#333" stroke-width="1.5"/>
    <circle cx="480" cy="163" r="4" fill="#ccc" stroke="#333" stroke-width="1.5"/>
    <circle cx="620" cy="187" r="4" fill="#ccc" stroke="#333" stroke-width="1.5"/>
    <circle cx="900" cy="290" r="4" fill="#ccc" stroke="#333" stroke-width="1.5"/>

    <!-- Gap annotations -->
    <text x="215" y="52" fill="#888" font-size="9">Δ=0.0010</text>
    <text x="355" y="92" fill="#888" font-size="9">Δ=0.0011</text>
    <text x="495" y="151" fill="#888" font-size="9">Δ=0.0009</text>
    <text x="635" y="176" fill="#888" font-size="9">Δ=0.0024</text>
    <text x="830" y="280" fill="#111" font-size="10" font-weight="bold">Δ=0.0017</text>

    <!-- Legend -->
    <line x1="700" y1="30" x2="740" y2="30" stroke="#333" stroke-width="2"/>
    <circle cx="720" cy="30" r="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="748" y="34" fill="#333" font-size="11">FP32 Baseline</text>

    <line x1="700" y1="50" x2="740" y2="50" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
    <circle cx="720" cy="50" r="3" fill="#ccc" stroke="#333" stroke-width="1.5"/>
    <text x="748" y="54" fill="#333" font-size="11">TurboQuant 4-bit</text>
  </g>

  <!-- Conclusion box -->
  <g transform="translate(100, 430)" font-family="'Helvetica Neue', sans-serif">
    <rect width="900" height="48" rx="2" fill="#f5f5f5" stroke="#111" stroke-width="1.5"/>
    <text x="450" y="20" text-anchor="middle" fill="#111" font-size="13" font-weight="bold">Key Finding: Loss gap remains bounded (0.0009–0.0024) across 1,500 steps</text>
    <text x="450" y="38" text-anchor="middle" fill="#555" font-size="12">Error Compensation prevents error accumulation — no drift observed. Gap does not grow with training duration.</text>
  </g>
</svg>