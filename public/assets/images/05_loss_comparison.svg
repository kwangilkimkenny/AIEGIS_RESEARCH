<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="'Georgia', 'Times New Roman', serif">
  <defs>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="2" cy="2" r="0.8" fill="#999"/>
    </pattern>
    <pattern id="stripe" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#888" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1100" height="620" fill="#fff"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" fill="#111" font-size="22" font-weight="bold" letter-spacing="1">Comprehensive Experiment Results Comparison</text>
  <line x1="370" y1="46" x2="730" y2="46" stroke="#111" stroke-width="1.5"/>
  <text x="550" y="66" text-anchor="middle" fill="#666" font-size="12" font-style="italic" font-family="'Helvetica Neue', sans-serif">Loss Comparison Across All Experiments (GPT-2 Nano, 150 Steps)</text>

  <!-- Chart area -->
  <g transform="translate(100, 85)">
    <!-- Y axis -->
    <line x1="60" y1="10" x2="60" y2="410" stroke="#333" stroke-width="1.2"/>
    <!-- X axis -->
    <line x1="60" y1="410" x2="940" y2="410" stroke="#333" stroke-width="1.2"/>

    <!-- Y axis label -->
    <text x="20" y="220" text-anchor="middle" fill="#333" font-size="13" font-weight="bold" font-family="'Helvetica Neue', sans-serif" transform="rotate(-90, 20, 220)">Loss</text>

    <!-- Y grid + labels -->
    <g font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#888">
      <text x="52" y="410" text-anchor="end">0.0</text>
      <line x1="60" y1="410" x2="940" y2="410" stroke="#eee" stroke-width="0.5"/>

      <text x="52" y="343" text-anchor="end">0.2</text>
      <line x1="60" y1="343" x2="940" y2="343" stroke="#eee" stroke-width="0.5"/>

      <text x="52" y="276" text-anchor="end">0.4</text>
      <line x1="60" y1="276" x2="940" y2="276" stroke="#eee" stroke-width="0.5"/>

      <text x="52" y="209" text-anchor="end">0.6</text>
      <line x1="60" y1="209" x2="940" y2="209" stroke="#eee" stroke-width="0.5"/>

      <text x="52" y="142" text-anchor="end">0.8</text>
      <line x1="60" y1="142" x2="940" y2="142" stroke="#eee" stroke-width="0.5"/>

      <text x="52" y="75" text-anchor="end">1.0</text>
      <line x1="60" y1="75" x2="940" y2="75" stroke="#eee" stroke-width="0.5"/>
    </g>

    <!-- Exp 1: 4-bit Gradient (no EF) -->
    <g transform="translate(115, 0)" font-family="'Helvetica Neue', sans-serif">
      <rect x="0" y="275" width="55" height="135" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="27" y="268" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">0.402</text>

      <rect x="65" y="157" width="55" height="253" fill="url(#dots)" stroke="#333" stroke-width="1.2"/>
      <text x="92" y="150" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">0.756</text>

      <!-- Label -->
      <text x="60" y="435" text-anchor="middle" fill="#333" font-size="11">4-bit Gradient</text>
      <text x="60" y="450" text-anchor="middle" fill="#888" font-size="10">(No EF)</text>

      <!-- Delta -->
      <text x="60" y="472" text-anchor="middle" fill="#888" font-size="11">&#x394; = +0.354</text>
      <text x="60" y="488" text-anchor="middle" fill="#888" font-size="11" font-style="italic">Degraded</text>
    </g>

    <!-- Exp 2: 4-bit + EF -->
    <g transform="translate(315, 0)" font-family="'Helvetica Neue', sans-serif">
      <rect x="0" y="277" width="55" height="133" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="27" y="270" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">0.395</text>

      <rect x="65" y="72" width="55" height="338" fill="url(#stripe)" stroke="#333" stroke-width="1.2"/>
      <text x="92" y="65" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">1.010</text>

      <text x="60" y="435" text-anchor="middle" fill="#333" font-size="11">4-bit + EF</text>
      <text x="60" y="450" text-anchor="middle" fill="#888" font-size="10">(Error Feedback)</text>

      <text x="60" y="472" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">&#x394; = +0.615</text>
      <text x="60" y="488" text-anchor="middle" fill="#333" font-size="11" font-weight="bold">Worsened &#xd7;</text>
    </g>

    <!-- Exp 3: TurboQuantAdamW -->
    <g transform="translate(515, 0)" font-family="'Helvetica Neue', sans-serif">
      <rect x="0" y="224" width="55" height="186" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="27" y="217" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">0.556</text>

      <rect x="65" y="284" width="55" height="126" fill="#ccc" stroke="#111" stroke-width="2"/>
      <text x="92" y="277" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">0.377</text>

      <text x="60" y="435" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">TurboQuant</text>
      <text x="60" y="450" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">AdamW</text>

      <text x="60" y="472" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">&#x394; = &#x2212;0.179</text>
      <text x="60" y="488" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Success &#x2605;</text>
    </g>

    <!-- Exp 4: Activation -->
    <g transform="translate(715, 0)" font-family="'Helvetica Neue', sans-serif">
      <rect x="0" y="74" width="55" height="336" fill="#fff" stroke="#333" stroke-width="1.2"/>
      <text x="27" y="67" text-anchor="middle" fill="#555" font-size="11" font-weight="bold">1.003</text>

      <rect x="65" y="73" width="55" height="337" fill="#ccc" stroke="#111" stroke-width="2"/>
      <text x="92" y="66" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">1.005</text>

      <text x="60" y="435" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">4-bit Activation</text>
      <text x="60" y="450" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Compression</text>

      <text x="60" y="472" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">&#x394; = +0.002</text>
      <text x="60" y="488" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Success &#x2605;</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(580, 590)" font-family="'Helvetica Neue', sans-serif" font-size="11">
    <rect x="0" y="-10" width="16" height="12" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="22" y="0" fill="#555">Baseline (FP32)</text>

    <rect x="120" y="-10" width="16" height="12" fill="url(#dots)" stroke="#333" stroke-width="1"/>
    <text x="142" y="0" fill="#555">TurboQuant</text>

    <rect x="225" y="-10" width="16" height="12" fill="url(#stripe)" stroke="#333" stroke-width="1"/>
    <text x="247" y="0" fill="#555">Failed</text>

    <rect x="285" y="-10" width="16" height="12" fill="#ccc" stroke="#111" stroke-width="2"/>
    <text x="307" y="0" fill="#111" font-weight="bold">Success &#x2605;</text>
  </g>
</svg>