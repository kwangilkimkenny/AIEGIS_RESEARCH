<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="'Georgia', 'Times New Roman', serif">
  <rect width="1100" height="420" fill="#fff"/>

  <text x="550" y="36" text-anchor="middle" fill="#111" font-size="22" font-weight="bold" letter-spacing="1">Competitive Technology Positioning</text>
  <line x1="320" y1="46" x2="780" y2="46" stroke="#111" stroke-width="1.5"/>
  <text x="550" y="66" text-anchor="middle" fill="#666" font-size="12" font-style="italic" font-family="'Helvetica Neue', sans-serif">TurboQuant: The Only Framework Addressing Both Communication and Memory Simultaneously</text>

  <!-- Feature matrix table -->
  <g transform="translate(40, 85)" font-family="'Helvetica Neue', sans-serif" font-size="11">
    <!-- Header -->
    <rect width="1020" height="32" fill="#e0e0e0" stroke="#333" stroke-width="1.2"/>
    <line x1="220" y1="0" x2="220" y2="32" stroke="#333" stroke-width="1"/>
    <line x1="340" y1="0" x2="340" y2="32" stroke="#333" stroke-width="1"/>
    <line x1="470" y1="0" x2="470" y2="32" stroke="#333" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="32" stroke="#333" stroke-width="1"/>
    <line x1="740" y1="0" x2="740" y2="32" stroke="#333" stroke-width="1"/>
    <line x1="870" y1="0" x2="870" y2="32" stroke="#333" stroke-width="1"/>

    <text x="110" y="21" text-anchor="middle" fill="#111" font-weight="bold">Technology</text>
    <text x="280" y="21" text-anchor="middle" fill="#111" font-weight="bold">Comm. Comp.</text>
    <text x="405" y="21" text-anchor="middle" fill="#111" font-weight="bold">Mem. Savings</text>
    <text x="535" y="21" text-anchor="middle" fill="#111" font-weight="bold">AdamW</text>
    <text x="670" y="21" text-anchor="middle" fill="#111" font-weight="bold">AMP</text>
    <text x="805" y="21" text-anchor="middle" fill="#111" font-weight="bold">Complexity</text>
    <text x="945" y="21" text-anchor="middle" fill="#111" font-weight="bold">Dual-axis</text>

    <!-- TurboQuant (highlighted) -->
    <rect y="32" width="1020" height="34" fill="#f0f0f0" stroke="#111" stroke-width="1.5"/>
    <line x1="220" y1="32" x2="220" y2="66" stroke="#111" stroke-width="1"/>
    <line x1="340" y1="32" x2="340" y2="66" stroke="#111" stroke-width="1"/>
    <line x1="470" y1="32" x2="470" y2="66" stroke="#111" stroke-width="1"/>
    <line x1="600" y1="32" x2="600" y2="66" stroke="#111" stroke-width="1"/>
    <line x1="740" y1="32" x2="740" y2="66" stroke="#111" stroke-width="1"/>
    <line x1="870" y1="32" x2="870" y2="66" stroke="#111" stroke-width="1"/>
    <text x="110" y="53" text-anchor="middle" fill="#111" font-weight="bold" font-size="12">TurboQuant ★</text>
    <text x="280" y="53" text-anchor="middle" fill="#111" font-weight="bold">8×</text>
    <text x="405" y="53" text-anchor="middle" fill="#111" font-weight="bold">4×</text>
    <text x="535" y="53" text-anchor="middle" fill="#111" font-weight="bold">✓</text>
    <text x="670" y="53" text-anchor="middle" fill="#111" font-weight="bold">✓</text>
    <text x="805" y="53" text-anchor="middle" fill="#555">Medium (Triton)</text>
    <text x="945" y="53" text-anchor="middle" fill="#111" font-weight="bold">✓ UNIQUE</text>

    <!-- 1-bit Adam -->
    <rect y="66" width="1020" height="30" fill="#fff" stroke="#333" stroke-width="0.5"/>
    <text x="110" y="85" text-anchor="middle" fill="#333">1-bit Adam</text>
    <text x="280" y="85" text-anchor="middle" fill="#333">32×</text>
    <text x="405" y="85" text-anchor="middle" fill="#888">—</text>
    <text x="535" y="85" text-anchor="middle" fill="#333">✓</text>
    <text x="670" y="85" text-anchor="middle" fill="#888">—</text>
    <text x="805" y="85" text-anchor="middle" fill="#333">High (C++)</text>
    <text x="945" y="85" text-anchor="middle" fill="#888">—</text>

    <!-- QSGD -->
    <rect y="96" width="1020" height="30" fill="#fafafa" stroke="#333" stroke-width="0.5"/>
    <text x="110" y="115" text-anchor="middle" fill="#333">QSGD</text>
    <text x="280" y="115" text-anchor="middle" fill="#333">8–32×</text>
    <text x="405" y="115" text-anchor="middle" fill="#888">—</text>
    <text x="535" y="115" text-anchor="middle" fill="#888">SGD only</text>
    <text x="670" y="115" text-anchor="middle" fill="#888">—</text>
    <text x="805" y="115" text-anchor="middle" fill="#333">Low</text>
    <text x="945" y="115" text-anchor="middle" fill="#888">—</text>

    <!-- Gradient Checkpointing -->
    <rect y="126" width="1020" height="30" fill="#fff" stroke="#333" stroke-width="0.5"/>
    <text x="110" y="145" text-anchor="middle" fill="#333">Grad. Checkpoint</text>
    <text x="280" y="145" text-anchor="middle" fill="#888">—</text>
    <text x="405" y="145" text-anchor="middle" fill="#333">2–4×</text>
    <text x="535" y="145" text-anchor="middle" fill="#333">✓</text>
    <text x="670" y="145" text-anchor="middle" fill="#333">✓</text>
    <text x="805" y="145" text-anchor="middle" fill="#333">Low</text>
    <text x="945" y="145" text-anchor="middle" fill="#888">—</text>

    <!-- ZeRO-3 -->
    <rect y="156" width="1020" height="30" fill="#fafafa" stroke="#333" stroke-width="0.5"/>
    <text x="110" y="175" text-anchor="middle" fill="#333">ZeRO-3 (DeepSpeed)</text>
    <text x="280" y="175" text-anchor="middle" fill="#888">—</text>
    <text x="405" y="175" text-anchor="middle" fill="#333">3–8×</text>
    <text x="535" y="175" text-anchor="middle" fill="#333">✓</text>
    <text x="670" y="175" text-anchor="middle" fill="#333">✓</text>
    <text x="805" y="175" text-anchor="middle" fill="#333">Medium</text>
    <text x="945" y="175" text-anchor="middle" fill="#888">—</text>

    <!-- CompAct -->
    <rect y="186" width="1020" height="30" fill="#fff" stroke="#333" stroke-width="0.5"/>
    <text x="110" y="205" text-anchor="middle" fill="#333">CompAct</text>
    <text x="280" y="205" text-anchor="middle" fill="#888">—</text>
    <text x="405" y="205" text-anchor="middle" fill="#333">2–4×</text>
    <text x="535" y="205" text-anchor="middle" fill="#333">✓</text>
    <text x="670" y="205" text-anchor="middle" fill="#333">✓</text>
    <text x="805" y="205" text-anchor="middle" fill="#333">Medium</text>
    <text x="945" y="205" text-anchor="middle" fill="#888">—</text>
  </g>

  <!-- Differentiators -->
  <g transform="translate(40, 320)" font-family="'Helvetica Neue', sans-serif">
    <rect width="1020" height="80" rx="2" fill="#f5f5f5" stroke="#111" stroke-width="1.5"/>
    <rect width="1020" height="24" fill="#ddd" stroke="#111" stroke-width="1.5"/>
    <text x="510" y="17" text-anchor="middle" fill="#111" font-size="12" font-weight="bold">Key Differentiators</text>

    <text x="30" y="44" fill="#111" font-size="11" font-weight="bold">1. Dual-axis compression</text>
    <text x="250" y="44" fill="#555" font-size="11">Only framework addressing both communication AND memory simultaneously</text>

    <text x="30" y="64" fill="#111" font-size="11" font-weight="bold">2. AdamW-native design</text>
    <text x="250" y="64" fill="#555" font-size="11">Momentum-level compression avoids EF-AdamW incompatibility (proven failure mode)</text>
  </g>
</svg>